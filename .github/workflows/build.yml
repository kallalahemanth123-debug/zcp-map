name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents: write lets the publish-apk job update the "latest" release. The optional log-publishing
# steps (off unless the repository variable PUBLISH_CI_LOGS is "true") also use it to push plain-text
# logs to ci-logs-* branches, for tools that cannot open the Actions log viewer.
permissions:
  contents: write

jobs:
  build:
    name: Build, unit tests, lint, APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable (lost when files come from Windows or a zip)
        run: chmod +x gradlew && mkdir -p build-logs

      - name: JVM unit tests (protocol, security, mesh, agent)
        run: ./gradlew --stacktrace --continue :core:protocol:test :core:security:test :core:mesh:test :core:agent:test 2>&1 | tee build-logs/1-unit-tests.log

      - name: Assemble debug + release APKs and test APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :core:keystore:assembleDebugAndroidTest 2>&1 | tee build-logs/2-assemble.log

      - name: Android lint
        run: ./gradlew --stacktrace --continue :app:lintDebug :core:keystore:lintDebug :core:transport:lintDebug 2>&1 | tee build-logs/3-lint.log

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zcp-map-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      - name: Summarise errors as annotations
        if: failure()
        run: |
          set +e
          for f in build-logs/*.log; do
            grep -n -E "^e: |What went wrong|FAILED|Could not |not found|Execution failed|error:|AssertionError|Exception" "$f" | head -40 | while IFS= read -r line; do
              echo "::error title=$(basename "$f")::${line:0:900}"
            done
          done

      - name: Remove old ci-logs branches (log publishing is off)
        if: always() && vars.PUBLISH_CI_LOGS != 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          for b in ci-logs-build ci-logs-emulator; do
            if git ls-remote --exit-code --heads "$remote" "$b" >/dev/null 2>&1; then
              git push -q "$remote" --delete "$b" && echo "deleted $b"
            fi
          done
          true

      - name: Publish logs to the ci-logs-build branch
        if: always() && vars.PUBLISH_CI_LOGS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          D=$(mktemp -d)
          cp -r build-logs "$D/" 2>/dev/null
          find . -path ./node_modules -prune -o \( -path '*/build/test-results/*' -name '*.xml' -o -path '*/build/reports/lint-results*' \) -type f -print | while read -r f; do mkdir -p "$D/$(dirname "$f")"; cp "$f" "$D/$f"; done
          cd "$D" && git init -q -b ci-logs-build && git add -A && \
            git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "build logs, run ${{ github.run_id }} (${{ github.sha }})" && \
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-build
          true

  emulator-tests:
    name: On-device tests (Android emulator)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew && mkdir -p build-logs

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests (Keystore, node boot, self-test, settings)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --stacktrace --continue :core:keystore:connectedDebugAndroidTest :app:connectedDebugAndroidTest > build-logs/4-emulator.log 2>&1 || (tail -200 build-logs/4-emulator.log; exit 1)

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - name: Summarise failures as annotations
        if: failure()
        run: |
          set +e
          grep -n -E "FAILED|Exception|What went wrong|AssertionError" build-logs/4-emulator.log | head -40 | while IFS= read -r line; do
            echo "::error title=4-emulator.log::${line:0:900}"
          done

      - name: Publish logs to the ci-logs-emulator branch
        if: always() && vars.PUBLISH_CI_LOGS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          D=$(mktemp -d)
          cp -r build-logs "$D/" 2>/dev/null
          find . -path '*/build/outputs/androidTest-results/*' -type f \( -name '*.xml' -o -name '*.txt' -o -name 'logcat*' \) -print | while read -r f; do mkdir -p "$D/$(dirname "$f")"; cp "$f" "$D/$f"; done
          cd "$D" && git init -q -b ci-logs-emulator && git add -A && \
            git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "emulator logs, run ${{ github.run_id }} (${{ github.sha }})" && \
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-emulator
          true

  publish-apk:
    name: Publish the installable APK (GitHub release "latest")
    runs-on: ubuntu-latest
    needs: [build, emulator-tests]
    # Only builds of main that passed everything above; pull requests never publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zcp-map-apks
          path: apks

      - name: Replace the "latest" pre-release with this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(find apks -type f -name 'app-debug.apk' | head -n 1)
          if [ -z "$apk" ]; then echo "::error::app-debug.apk missing from the build artifact"; exit 1; fi
          cp "$apk" zcp-map-debug.apk
          sha256sum zcp-map-debug.apk > zcp-map-debug.apk.sha256
          cat > notes.md <<NOTES
          Built from ${GITHUB_SHA::7} after the unit tests, lint and the emulator tests passed.

          **Install (do this on both phones, Android 13 or newer):**
          1. Open this page on the phone and tap \`zcp-map-debug.apk\`.
          2. Allow your browser to install apps when Android asks, then tap Install.
          3. Open ZCP-MAP, tap SELF-TEST and follow any fixes it lists.

          This is a debug build signed with the project's public test key, so later builds from this
          page install over it. It is meant for testing, not for an app store.
          NOTES
          gh release delete latest -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest zcp-map-debug.apk zcp-map-debug.apk.sha256 -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "ZCP-MAP latest test build (${GITHUB_SHA::7})" --notes-file notes.md
